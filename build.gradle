plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "totem-lumen" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            client()
            runDir('run/client')
            programArg('--graphicsBackend=VULKAN')
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register('verifyRuntimeShader', JavaExec) {
    dependsOn tasks.named('clientClasses')
    classpath = sourceSets.client.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'dev.totem.lumen.vulkan.P14ShaderCompileVerifier'
}

tasks.register('verifyP14DDynamicMeshes', JavaExec) {
    dependsOn tasks.named('clientClasses')
    classpath = sourceSets.client.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'dev.totem.lumen.geometry.P14DDynamicMeshVerifier'
}

tasks.register('verifyP14DMixinDescriptors', JavaExec) {
    dependsOn tasks.named('clientClasses')
    classpath = sourceSets.client.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'dev.totem.lumen.geometry.P14DMixinDescriptorVerifier'
}

tasks.register('verifyP14EFluidMixinDescriptors', JavaExec) {
    dependsOn tasks.named('clientClasses')
    classpath = sourceSets.client.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'dev.totem.lumen.geometry.P14EFluidMixinDescriptorVerifier'
}

tasks.named('check') {
    dependsOn tasks.named('verifyRuntimeShader')
    dependsOn tasks.named('verifyP14DDynamicMeshes')
    dependsOn tasks.named('verifyP14DMixinDescriptors')
    dependsOn tasks.named('verifyP14EFluidMixinDescriptors')
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}

jar {
    from('LICENSE.txt') {
        rename { "${it}_${project.name}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
