    const byId = new Map(nodes.map(node => [node.id, node]));
    const links = [['server','wire'],['wire','profiles'],['profiles','native'],['profiles','totem'],['native','output'],['totem','output']];
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const detail = document.getElementById('detail');
    const moveButton = document.getElementById('moveMode');
    let width = 0, height = 0, dpr = 1, activeGroup = null, selected = null, hover = null;
    let moving = false, pointer = null, dragged = false;
    const camera = { yaw: -0.10, pitch: 0.07, zoom: 0.85, panX: 0, panY: 0 };

    function resize() {
      const previousWidth = width;
      width = window.innerWidth; height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
      camera.zoom = previousWidth ? camera.zoom : width < 700 ? 0.83 : Math.min(1.0, Math.max(0.59, (width - 100) / 1600));
      if (!previousWidth && width < 700) camera.panX = 540;
      draw();
    }
    function world(node) {
      if (!node.rootOf) return node;
      const parent = byId.get(node.rootOf);
      return { x: parent.x + node.dx, y: parent.y + node.dy, z: parent.z + node.dz };
    }
    function project(node) {
      const p = world(node), cy = Math.cos(camera.yaw), sy = Math.sin(camera.yaw);
      const cp = Math.cos(camera.pitch), sp = Math.sin(camera.pitch);
      const rx = p.x * cy - p.z * sy, rz = p.x * sy + p.z * cy;
      const ry = p.y * cp - rz * sp, depth = p.y * sp + rz * cp;
      const perspective = 1250 / (1250 + depth);
      const scale = camera.zoom * perspective;
      return { x: width / 2 + camera.panX + rx * scale, y: height / 2 + camera.panY + ry * scale,
        scale, depth, w: (node.root ? 204 : 185) * scale, h: (node.root ? 78 : 69) * scale };
    }
    function visibleNodes() { return nodes.filter(n => n.root || n.rootOf === activeGroup); }
    function roundRect(x,y,w,h,r) {
      ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
    }
    function drawBackground() {
      const g = ctx.createRadialGradient(width*.52,height*.49,40,width*.52,height*.49,Math.max(width,height)*.75);
      g.addColorStop(0,'#17364a'); g.addColorStop(.52,'#0a1b29'); g.addColorStop(1,'#061019');
      ctx.fillStyle = g; ctx.fillRect(0,0,width,height);
      ctx.strokeStyle = '#40748719'; ctx.lineWidth = 1;
      const gap = 72 * Math.max(.65,camera.zoom);
      for (let x = ((camera.panX + width/2) % gap) - gap; x < width + gap; x += gap) {
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,height); ctx.stroke();
      }
      for (let y = ((camera.panY + height/2) % gap) - gap; y < height + gap; y += gap) {
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(width,y); ctx.stroke();
      }
      ctx.fillStyle='#9bdcd344';
      for (let i=0;i<36;i++) {
        const x=(i*239.73+width*.18)%width, y=(i*137.19+height*.27)%height;
        ctx.beginPath();ctx.arc(x,y,i%5===0?1.4:.7,0,Math.PI*2);ctx.fill();
      }
    }
    function drawLink(a,b,color,dashed=false) {
      const p=project(byId.get(a)),q=project(byId.get(b));
      const vx=q.x-p.x,vy=q.y-p.y,len=Math.hypot(vx,vy)||1,ux=vx/len,uy=vy/len;
      const start={x:p.x+ux*p.w*.49,y:p.y+uy*p.h*.47};
      const end={x:q.x-ux*q.w*.50,y:q.y-uy*q.h*.49};
      const mx=(start.x+end.x)/2,my=(start.y+end.y)/2;
      ctx.save();ctx.strokeStyle=color;ctx.lineWidth=dashed?1.4:2;ctx.setLineDash(dashed?[5,6]:[]);
      ctx.shadowBlur=11;ctx.shadowColor=color;
      ctx.beginPath();ctx.moveTo(start.x,start.y);
      ctx.quadraticCurveTo(mx,my-23*camera.zoom,end.x,end.y);ctx.stroke();
      ctx.setLineDash([]);ctx.shadowBlur=0;
      const angle=Math.atan2(end.y-my,end.x-mx),size=7*Math.max(.7,camera.zoom);
      ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(end.x,end.y);
      ctx.lineTo(end.x-Math.cos(angle-.5)*size,end.y-Math.sin(angle-.5)*size);
      ctx.lineTo(end.x-Math.cos(angle+.5)*size,end.y-Math.sin(angle+.5)*size);
      ctx.closePath();ctx.fill();ctx.restore();
    }
    function drawNode(node) {
      const p=project(node), x=p.x-p.w/2,y=p.y-p.h/2;
      const isSelected=selected===node.id,isHovered=hover===node.id;
      ctx.save();ctx.shadowColor=node.color;ctx.shadowBlur=isSelected?25:isHovered?17:10;
      ctx.fillStyle='#091a28e8';ctx.strokeStyle=isSelected?'#f3faf7':node.color;
      ctx.lineWidth=isSelected?2.1:1.25;
      roundRect(x,y,p.w,p.h,Math.max(9,13*p.scale));ctx.fill();ctx.stroke();ctx.shadowBlur=0;
      const grad=ctx.createLinearGradient(x,y,x+p.w,y+p.h);
      grad.addColorStop(0,node.color+'30');grad.addColorStop(1,node.color+'04');
      ctx.fillStyle=grad;roundRect(x+1,y+1,p.w-2,p.h-2,Math.max(8,12*p.scale));ctx.fill();
      ctx.fillStyle=node.color;roundRect(x+11*p.scale,y+12*p.scale,3*p.scale,p.h-24*p.scale,3*p.scale);ctx.fill();
      ctx.textBaseline='middle';ctx.textAlign='left';
      ctx.fillStyle='#eff8f9';ctx.font=`${node.root?700:650} ${Math.max(10,(node.root?16:14)*p.scale)}px ui-sans-serif,system-ui`;
      ctx.fillText(node.title,x+23*p.scale,y+29*p.scale,p.w-35*p.scale);
      ctx.fillStyle='#a9c2ca';ctx.font=`${Math.max(8,10.5*p.scale)}px ui-sans-serif,system-ui`;
      ctx.fillText(node.sub,x+23*p.scale,y+52*p.scale,p.w-34*p.scale);
      if(node.root){ctx.fillStyle=node.color;ctx.font=`${Math.max(8,11*p.scale)}px ui-sans-serif,system-ui`;
        ctx.textAlign='right';ctx.fillText(activeGroup===node.id?'−':'+',x+p.w-12*p.scale,y+18*p.scale);}
      if(node.id==='future'){ctx.setLineDash([4,4]);ctx.strokeStyle='#e39b86';ctx.lineWidth=1;roundRect(x-4,y-4,p.w+8,p.h+8,16*p.scale);ctx.stroke();}
      ctx.restore();
    }
    function draw() {
      if(!width||!height)return;
      ctx.setTransform(dpr,0,0,dpr,0,0);drawBackground();
      for(const [a,b] of links) drawLink(a,b,'#90bdc477');
      if(activeGroup){
        const root=byId.get(activeGroup);
        for(const childId of root.children) drawLink(activeGroup,childId,childId==='future'?'#e39b86aa':root.color+'a8',childId==='future');
      }
      const ordered=visibleNodes().sort((a,b)=>project(b).depth-project(a).depth);
      for(const node of ordered) drawNode(node);
    }
    function hit(x,y) {
      const ordered=visibleNodes().sort((a,b)=>project(b).depth-project(a).depth);
      for(let i=ordered.length-1;i>=0;i--){const n=ordered[i],p=project(n);
        if(x>=p.x-p.w/2&&x<=p.x+p.w/2&&y>=p.y-p.h/2&&y<=p.y+p.h/2)return n;}
      return null;
    }
    function fillDetail(node) {
      document.getElementById('detailKind').textContent=node.kind;
      document.getElementById('detailTitle').textContent=node.title;
      document.getElementById('detailStatus').textContent=node.status;
      document.getElementById('detailDescription').textContent=node.description;
      document.getElementById('detailFlow').textContent=node.flow;
      document.getElementById('detailBoundary').textContent=node.boundary;
      const refs=document.getElementById('detailSources');refs.replaceChildren();
      for(const item of node.refs){const a=document.createElement('a');a.href=item.href;a.textContent=item.label;refs.append(a);}
      detail.classList.add('open');
    }
    function focusGroup(id) {
      const p=project(byId.get(id));
      camera.panX += width*(width<700?.50:.44)-p.x;
      camera.panY += height*.48-p.y;
    }
    function select(node) {
      if(node.root){activeGroup=activeGroup===node.id?null:node.id;if(activeGroup)focusGroup(node.id);}
      selected=node.id;fillDetail(node);draw();
    }
    function closeDetail() { detail.classList.remove('open');selected=null;draw(); }
    function reset() {camera.yaw=-.10;camera.pitch=.07;camera.zoom=width<700?.83:Math.min(1,Math.max(.59,(width-100)/1600));camera.panX=width<700?540:0;camera.panY=0;activeGroup=null;selected=null;detail.classList.remove('open');draw();}
    canvas.addEventListener('pointerdown',event=>{canvas.focus();canvas.setPointerCapture(event.pointerId);pointer={x:event.clientX,y:event.clientY,button:event.button};dragged=false;canvas.classList.add('dragging');});
    canvas.addEventListener('pointermove',event=>{
      if(!pointer){const h=hit(event.clientX,event.clientY);const id=h?.id||null;if(id!==hover){hover=id;canvas.style.cursor=id?'pointer':'grab';draw();}return;}
      const dx=event.clientX-pointer.x,dy=event.clientY-pointer.y;
      if(Math.abs(dx)+Math.abs(dy)>2)dragged=true;
      if(dragged){if(moving||pointer.button===2||event.shiftKey){camera.panX+=dx;camera.panY+=dy;}
        else{camera.yaw=Math.max(-.42,Math.min(.42,camera.yaw+dx*.002));camera.pitch=Math.max(-.30,Math.min(.30,camera.pitch+dy*.002));}
        pointer.x=event.clientX;pointer.y=event.clientY;draw();}
    });
    canvas.addEventListener('pointerup',event=>{if(!dragged){const n=hit(event.clientX,event.clientY);if(n)select(n);}pointer=null;canvas.classList.remove('dragging');});
    canvas.addEventListener('pointercancel',()=>{pointer=null;canvas.classList.remove('dragging');});
    canvas.addEventListener('contextmenu',event=>event.preventDefault());
    canvas.addEventListener('wheel',event=>{event.preventDefault();camera.zoom=Math.max(.42,Math.min(1.8,camera.zoom*Math.exp(-event.deltaY*.001)));draw();},{passive:false});
    canvas.addEventListener('keydown',event=>{
      const list=visibleNodes();let index=list.findIndex(n=>n.id===selected);
      if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(event.key)){event.preventDefault();index=(index+(event.key==='ArrowRight'||event.key==='ArrowDown'?1:-1)+list.length)%list.length;selected=list[index].id;fillDetail(list[index]);draw();}
      else if(event.key==='Enter'||event.key===' '){event.preventDefault();const n=byId.get(selected)||list[0];select(n);}
      else if(event.key==='Escape'){event.preventDefault();closeDetail();activeGroup=null;draw();}
      else if(event.key==='+'||event.key==='='){camera.zoom=Math.min(1.8,camera.zoom*1.12);draw();}
      else if(event.key==='-'){camera.zoom=Math.max(.42,camera.zoom/1.12);draw();}
    });
    document.getElementById('resetView').addEventListener('click',reset);
    document.getElementById('closeDetail').addEventListener('click',closeDetail);
    moveButton.addEventListener('click',()=>{moving=!moving;moveButton.setAttribute('aria-pressed',String(moving));moveButton.textContent=moving?'旋轉模式':'平移模式';});
    window.addEventListener('resize',resize);
    resize();
