name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Upload development jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: totem-lumen-${{ github.sha }}
          path: |
            build/libs/totem-lumen-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
