name: Sync Modrinth Icon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate icon
        run: node scripts/sync-modrinth-icon.mjs --check

      - name: Upload and verify Modrinth icon
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: node scripts/sync-modrinth-icon.mjs --upload
